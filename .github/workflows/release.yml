# Builds release packages and attaches them to a draft GitHub Release.
#
# Trigger: push a version tag (see scripts/release.sh), e.g.
#   git tag v0.2.0 && git push origin v0.2.0
# Output: a *draft* release with
#   - Linux: .deb, .rpm, .AppImage and a plain-binary .tar.gz
#   - macOS: universal .dmg (Intel + Apple Silicon)
#   - Windows: NSIS installer .exe and a portable .exe
# Review it on GitHub, then publish. Release notes: .github/release-notes.md
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Create the draft up front so the parallel build jobs all upload into one release
  # instead of racing to create it.
  draft:
    name: create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; builds will upload into it."
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "mdedit $TAG" --notes-file .github/release-notes.md
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            # oldest supported runner = oldest glibc = widest distro compatibility
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: macos-universal
            runner: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - name: windows-x64
            runner: windows-latest
            args: --bundles nsis

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          if [[ "$TAG" != "v$version" || "$cargo_version" != "$version" ]]; then
            echo "::error::Tag $TAG, package.json $version and Cargo.toml $cargo_version must match (use scripts/release.sh)"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: mdedit ${{ env.TAG }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Plain binaries next to the installers (tauri-action only uploads bundles).
      - name: Upload Linux binary tarball
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="mdedit-${TAG#v}-linux-x86_64"
          mkdir "$dir"
          cp src-tauri/target/release/mdedit README.md LICENSE "$dir/"
          cp src-tauri/icons/128x128.png "$dir/mdedit.png"
          tar -czf "$dir.tar.gz" "$dir"
          gh release upload "$TAG" "$dir.tar.gz" --clobber

      - name: Upload Windows portable exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe="mdedit_${TAG#v}_x64-portable.exe"
          cp src-tauri/target/release/mdedit.exe "$exe"
          gh release upload "$TAG" "$exe" --clobber
